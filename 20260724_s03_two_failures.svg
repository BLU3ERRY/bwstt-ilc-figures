<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="900" viewBox="0 0 1600 900"
     role="img" aria-labelledby="title desc">
  <title id="title">One contact boundary, two independent failure modes</title>
  <desc id="desc">
    A central foot-contact boundary branches left to the ILC representation
    question of which force value is read at the boundary, and right to the
    R-GED observation question of how the boundary is established.
  </desc>

  <defs>
    <style>
      .sans { font-family: "DejaVu Sans", Arial, sans-serif; }
      .ink { fill: #18212b; }
      .muted { fill: #65717f; }
      .white { fill: #ffffff; }
      .blue { fill: #0072b2; }
      .green { fill: #009e73; }
      .orange { fill: #e69f00; }
      .vermillion { fill: #d55e00; }
      .navy { fill: #174a6e; }
      .smallcaps { font-size: 18px; font-weight: 700; letter-spacing: 2.2px; }
      .lanehead { font-size: 28px; font-weight: 800; letter-spacing: 0.4px; }
      .node { font-size: 24px; font-weight: 650; }
      .subnode { font-size: 19px; font-weight: 650; }
      .domain { font-size: 20px; font-weight: 800; letter-spacing: 1.1px; }
    </style>

    <marker id="arrow-blue" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0072b2"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#009e73"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#e69f00"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5"
                    flood-color="#174a6e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Central physical interface -->
  <g class="sans" aria-label="contact boundary">
    <text x="800" y="45" class="smallcaps navy" text-anchor="middle">
      ONE PHYSICAL CONTACT
    </text>

    <!-- stylized shank and foot -->
    <path d="M 790 57 C 786 78, 782 96, 775 116
             C 772 125, 779 133, 790 134
             L 841 134 C 856 134, 863 141, 852 147
             C 831 158, 794 158, 764 151
             C 747 147, 743 137, 751 126
             C 760 114, 770 101, 774 83
             L 780 56 Z"
          fill="#174a6e" opacity="0.95"/>
    <line x1="730" y1="160" x2="870" y2="160"
          stroke="#18212b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="800" cy="160" r="9" fill="#ffffff"
            stroke="#174a6e" stroke-width="5"/>
    <line x1="800" y1="160" x2="800" y2="212"
          stroke="#174a6e" stroke-width="3" stroke-dasharray="7 8"/>
    <text x="800" y="201" class="sans node ink" text-anchor="middle">
      step / phase boundary
    </text>
  </g>

  <!-- Branch from the same contact to two different questions -->
  <path d="M 790 218 C 690 220, 540 228, 390 250"
        fill="none" stroke="#0072b2" stroke-width="4"
        marker-end="url(#arrow-blue)"/>
  <path d="M 810 218 C 910 220, 1060 228, 1210 250"
        fill="none" stroke="#e69f00" stroke-width="4"
        marker-end="url(#arrow-orange)"/>

  <!-- Left lane: force value / representation -->
  <g class="sans" aria-label="ILC representation track">
    <text x="390" y="286" class="smallcaps blue" text-anchor="middle">
      VALUE AT THE BOUNDARY
    </text>
    <text x="390" y="323" class="lanehead ink" text-anchor="middle">
      Which force value is read here?
    </text>
    <line x1="145" y1="343" x2="635" y2="343"
          stroke="#0072b2" stroke-width="3" opacity="0.28"/>

    <!-- periodic endpoint-coupling icon -->
    <g transform="translate(110 364)">
      <path d="M 0 86 C 47 9, 110 9, 157 86
               C 204 163, 267 163, 314 86"
            fill="none" stroke="#0072b2" stroke-width="6"
            stroke-linecap="round"/>
      <circle cx="0" cy="86" r="9" fill="#ffffff"
              stroke="#0072b2" stroke-width="5"/>
      <circle cx="314" cy="86" r="9" fill="#ffffff"
              stroke="#0072b2" stroke-width="5"/>
      <path d="M 4 61 C 58 24, 255 24, 310 61"
            fill="none" stroke="#65717f" stroke-width="3"
            stroke-dasharray="8 7"/>
      <text x="157" y="184" class="node ink" text-anchor="middle">
        <tspan x="157" dy="0">Periodic side endpoints</tspan>
        <tspan x="157" dy="31">coupled incorrectly</tspan>
      </text>
    </g>

    <path d="M 472 450 L 560 450"
          fill="none" stroke="#009e73" stroke-width="4"
          marker-end="url(#arrow-green)"/>

    <!-- force step icon -->
    <g transform="translate(570 382)">
      <line x1="0" y1="116" x2="0" y2="42"
            stroke="#65717f" stroke-width="3"/>
      <line x1="0" y1="116" x2="150" y2="116"
            stroke="#65717f" stroke-width="3"/>
      <path d="M 12 99 L 65 99 L 65 55 L 137 55"
            fill="none" stroke="#d55e00" stroke-width="7"
            stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="65" y1="31" x2="65" y2="125"
            stroke="#d55e00" stroke-width="2.5"
            stroke-dasharray="6 6" opacity="0.72"/>
      <text x="75" y="184" class="node ink" text-anchor="middle">
        <tspan x="75" dy="0">Force-profile</tspan>
        <tspan x="75" dy="31">step</tspan>
      </text>
    </g>

    <rect x="190" y="630" width="400" height="66" rx="33"
          fill="#eaf6f2" stroke="#009e73" stroke-width="2.5"/>
    <text x="390" y="671" class="domain green" text-anchor="middle">
      ILC REPRESENTATION TRACK
    </text>
  </g>

  <!-- Right lane: boundary evidence / observation -->
  <g class="sans" aria-label="R-GED observation track">
    <text x="1210" y="286" class="smallcaps orange" text-anchor="middle">
      BOUNDARY EVIDENCE
    </text>
    <text x="1210" y="323" class="lanehead ink" text-anchor="middle">
      How is this boundary established?
    </text>
    <line x1="965" y1="343" x2="1455" y2="343"
          stroke="#e69f00" stroke-width="3" opacity="0.32"/>

    <!-- live branch -->
    <g transform="translate(905 365)">
      <text x="137" y="0" class="smallcaps vermillion" text-anchor="middle">
        LIVE CONTROL
      </text>
      <circle cx="137" cy="61" r="42" fill="#fff5ec"
              stroke="#d55e00" stroke-width="3"/>
      <path d="M 137 38 L 137 65 L 158 79"
            fill="none" stroke="#d55e00" stroke-width="5"
            stroke-linecap="round"/>
      <text x="137" y="128" class="subnode ink" text-anchor="middle">
        <tspan x="137" dy="0">No usable real event</tspan>
        <tspan x="137" dy="26">by the deadline</tspan>
      </text>
      <path d="M 137 168 L 137 207" fill="none"
            stroke="#e69f00" stroke-width="4"
            marker-end="url(#arrow-orange)"/>
      <text x="137" y="246" class="node ink" text-anchor="middle">
        Cadence fallback
      </text>
    </g>

    <!-- offline branch -->
    <g transform="translate(1195 365)">
      <text x="150" y="0" class="smallcaps orange" text-anchor="middle">
        OFFLINE CHECK
      </text>
      <line x1="83" y1="68" x2="217" y2="68"
            stroke="#65717f" stroke-width="5" stroke-linecap="round"/>
      <circle cx="111" cy="68" r="13" fill="#ffffff"
              stroke="#e69f00" stroke-width="5"/>
      <circle cx="189" cy="68" r="13" fill="#ffffff"
              stroke="#d55e00" stroke-width="5"/>
      <path d="M 125 45 C 144 25, 160 25, 178 45"
            fill="none" stroke="#65717f" stroke-width="3"
            marker-end="url(#arrow-orange)"/>
      <text x="150" y="128" class="subnode ink" text-anchor="middle">
        <tspan x="150" dy="0">Event instant depends</tspan>
        <tspan x="150" dy="26">on the reference</tspan>
      </text>
      <path d="M 150 168 L 150 207" fill="none"
            stroke="#e69f00" stroke-width="4"
            marker-end="url(#arrow-orange)"/>
      <text x="150" y="246" class="node ink" text-anchor="middle">
        Timing uncertainty
      </text>
    </g>

    <rect x="1010" y="630" width="400" height="66" rx="33"
          fill="#fff5e6" stroke="#e69f00" stroke-width="2.5"/>
    <text x="1210" y="671" class="domain orange" text-anchor="middle">
      R-GED OBSERVATION TRACK
    </text>
  </g>

  <!-- Main takeaway -->
  <g class="sans" filter="url(#soft-shadow)">
    <rect x="210" y="753" width="1180" height="102" rx="24"
          fill="#174a6e"/>
    <text x="800" y="798" class="white"
          text-anchor="middle" font-size="29" font-weight="800"
          letter-spacing="1.1px">
      SAME CONTACT, DIFFERENT FAILURE
    </text>
    <text x="800" y="832" fill="#dfeaf1"
          text-anchor="middle" font-size="21" font-weight="550">
      The two tracks meet at the phase boundary; neither causes the other.
    </text>
  </g>
</svg>
